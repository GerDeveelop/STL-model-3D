            def tree(depth,area):
             if depth==3 or (depth and rng.random()<.65):
              state=rng.randrange(19);expected[state]+=area;leaves[0]+=1;return leaf_code(state)
             split=rng.randrange(1,4);side=rng.randrange(3) if split<3 else 0
