            j=decoded(leaf_code(value));assert j['leaf_count']==1 and j['filament_fractions']==[{'filament':value,'fraction':1}]
           check('leaf_state_'+str(value),leaf)
          for code in ('G',' ','C','04','7','D','1','FC',leaf_code(4097)):
