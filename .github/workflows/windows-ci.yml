           commands=[dict(op='export',piece=p['id']) for p in initial['current']['pieces']]
           j=connected_result(mode,extra=commands);volumes=0
           for item in j['exports']:volumes+=expect(base64.b64decode(item['stl_base64']))['signed_volume']
           assert math.isclose(volumes,sum(p['signed_volume'] for p in initial['current']['pieces']),abs_tol=1e-4)
          for mode in ('partition','inserts'):
           check('region_connector_export_'+mode,lambda mode=mode:region_exports(mode))
          def region_history():
           j=connected_result(extra=[dict(op='undo'),dict(op='redo')])
           assert j['states'][1]['pieces']==j['states'][3]['pieces']
           assert j['states'][2]['undo']==0 and j['states'][2]['redo']==1
           assert j['current']['connector']['enabled'] and j['current']['connector']['diameter']==1
          check('region_connector_history_atomic',region_history)
          def zero_gap():
           spec=dict(region_spec,clearance=0);j=connected_result(spec=spec);links=nominal(j,spec)
           assert all(math.isclose(l['added_volume'],l['removed_volume'],abs_tol=1e-7) for l in links)
          check('region_connector_zero_clearance',zero_gap)
          def no_wall_fit():
           j=connected_result(spec=dict(region_spec,wall=10))
           assert not connected_links(j),j
           assert j['connector_reports'][0]['connections'] and all(not l['connected'] for l in j['connector_reports'][0]['connections'])
           baseline=volume_result()['current']['pieces']
           assert [(p['signed_volume'],p['triangles']) for p in baseline]==[(p['signed_volume'],p['triangles']) for p in j['current']['pieces']]
          check('region_connector_insufficient_wall_reported_unchanged',no_wall_fit)
          def disconnected_regions():
           j=connected_result(data=color_model(combined=True))
           assert j['connector_reports'][0]['connections']==[] and len(j['current']['pieces'])==2,j
           assert math.isclose(sum(p['signed_volume'] for p in j['current']['pieces']),16000,abs_tol=1e-6)
          check('region_connector_disconnected_no_spurious_pin',disconnected_regions)
          check('region_connector_reflection',lambda:nominal(connected_result(data=paint_model(reflect=True))))
          def same_rgb_regions():
           data=mutate_zip(paint_model(),extras={'Metadata/project_settings.config':json.dumps({'filament_colour':['#FF0000','#FF0000']})})
           j=connected_result(data=data);nominal(j)
           assert len({(p['materials'][0]['resource'],p['materials'][0]['property']) for p in j['current']['pieces']})==2
          check('region_connector_same_rgb_distinct_materials',same_rgb_regions)
          for name,spec,fragment in (
            ('zero_diameter',dict(region_spec,diameter=0),'invalidos'),
            ('negative_wall',dict(region_spec,wall=-1),'invalidos'),
            ('oversized_depth',dict(region_spec,depth=100),'fuera de escala')):
           volume_reject('region_connector_invalid_'+name,connected_command(spec=spec),fragment,prior=True)
          volume_reject('region_connector_requires_object',connected_command(spec=3),'Conector JSON')
          def region_budget():
           j=edit(paint_model(),[connected_command()],False,limits=dict(bytes=5000))
           assert 'presupuesto' in j['error'] and j['current']['undo']==0 and len(j['current']['pieces'])==1,j
           assert not j.get('connector_reports'),j
          check('region_connector_failed_commit_no_partial_report',region_budget)
          def region_multiple_reports():
           j=edit(paint_model(),[connected_command(),dict(op='undo'),connected_command()])
           assert len(j['connector_reports'])==2 and j['connector_reports'][0]['step']==1 and j['connector_reports'][1]['step']==3
           a=j['connector_reports'][0]['connections'][0];b=j['connector_reports'][1]['connections'][0]
           assert a['connected'] and b['connected'] and a['donor_piece']!=b['donor_piece']
           assert a['position']==b['position'] and math.isclose(a['added_volume'],b['added_volume'],abs_tol=1e-6)
          check('region_connector_multiple_operations_reports',region_multiple_reports)
          def octa_model():
           vv=[(10,0,0),(-10,0,0),(0,10,0),(0,-10,0),(0,0,10),(0,0,-10)]
           ff=[(0,2,4),(2,1,4),(1,3,4),(3,0,4),(2,0,5),(1,2,5),(3,1,5),(0,3,5)]
           vs='<vertices>'+''.join(f'<vertex x="{x}" y="{y}" z="{z}"/>' for x,y,z in vv)+'</vertices>'
           ts='<triangles>'+''.join(f'<triangle v1="{a}" v2="{b}" v3="{c}" pid="1" p1="{int(i>=4)}"/>' for i,(a,b,c) in enumerate(ff))+'</triangles>'
           return mutate_zip(color_model(combined=True),lambda xml:re.sub(r'<vertices>.*?</vertices>',lambda _:vs,re.sub(r'<triangles>.*?</triangles>',lambda _:ts,xml)))
          def oblique_exterior():
           command=connected_command();command['resolution']=2.5
           j=edit(octa_model(),[command]);nominal(j,expected=4000/3)
           commands=[command]+[dict(op='export',piece=p['id']) for p in j['current']['pieces']]
           exported=edit(octa_model(),commands)
           for item in exported['exports']:
            data=base64.b64decode(item['stl_base64'])
            for i in range(struct.unpack_from('<I',data,80)[0]):
             coordinates=struct.unpack_from('<9f',data,84+50*i+12)
             assert all(sum(abs(c) for c in coordinates[k:k+3])<=10+1e-5 for k in (0,3,6))
          check('region_connector_oblique_exterior_preserved',oblique_exterior)
          def cylindrical_rings():
           initial=connected_result();link=nominal(initial)[0]
           j=connected_result(extra=[dict(op='export',piece=link['donor_piece']),dict(op='export',piece=link['receiver_piece'])])
           for item,depth,radius in ((j['exports'][0],1,.5),(j['exports'][1],1.1,.6)):
            data=base64.b64decode(item['stl_base64']);ring=set();n=link['normal'];p=link['position']
            for i in range(struct.unpack_from('<I',data,80)[0]):
             coords=struct.unpack_from('<9f',data,84+50*i+12)
             for k in (0,3,6):
              q=[coords[k+t]-p[t] for t in range(3)];projection=sum(q[t]*n[t] for t in range(3))
              radial=math.sqrt(max(0,sum(x*x for x in q)-projection*projection))
              if abs(projection-depth)<1e-5 and abs(radial-radius)<1e-5:ring.add(tuple(round(v,6) for v in coords[k:k+3]))
            assert len(ring)>=60,(len(ring),depth,radius)
          check('region_connector_exported_pin_socket_rings',cylindrical_rings)
          (root/'build/ci-paint-verification.json').write_text(json.dumps({'passed':sum(x['ok'] for x in results),'total':len(results),'cases':results},indent=2))
          print(json.dumps({'passed':sum(x['ok'] for x in results),'total':len(results),'failed':[x for x in results if not x['ok']]}))
          assert all(x['ok'] for x in results)

          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Paint verification failed' }

      - name: Upload package and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
