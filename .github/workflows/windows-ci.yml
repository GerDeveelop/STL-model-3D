          check('empty_inherits',empty)
          def split_geometry():
           for split in (1,2,3):
            for side in (range(3) if split<3 else range(1)):
             n=split+1;code=''.join(leaf_code(i+1) for i in range(n))+format(side*4+split,'X')
             j=decoded(code);assert j['leaf_count']==n
