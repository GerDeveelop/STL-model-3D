name: Windows x64 Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'core/**'
      - 'scripts/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'THIRD_PARTY_NOTICES.md'
      - '.gitattributes'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify Qt 6.8.3
        run: |
          try {
            ./scripts/bootstrap-windows.ps1
          } catch {
            $message = $_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Qt bootstrap::$message"
            throw
          }

      - name: Download and verify lib3mf 2.5.0
        run: ./scripts/bootstrap-lib3mf.ps1

      - name: Download and verify Manifold 3.5.4
        run: ./scripts/bootstrap-manifold.ps1

      - name: Download and verify miniz 3.1.0
        run: ./scripts/bootstrap-miniz.ps1

      - name: Build and package Release x64
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC not found' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64 -vcvars_ver=14.44'
          if ($env:VCToolsVersion -notlike '14.44.*') { throw 'MSVC 14.44 required' }
          $crt = @(Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64') -Directory -Filter 'Microsoft.VC*.CRT')
          if ($crt.Count -ne 1) { throw 'Ambiguous redistributable CRT' }
          $inventory = [ordered]@{
            commit = $env:GITHUB_SHA
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            vs = $vs
            msvc_toolset = $env:VCToolsVersion
            sdk = $env:WindowsSDKVersion
            cmake = (& cmake --version | Select-Object -First 1)
            ninja = (& ninja --version)
            python = (& python --version)
            qt = '6.8.3'
            crt = $crt[0].FullName
            crt_version = (Get-Item (Join-Path $crt[0].FullName 'vcruntime140.dll')).VersionInfo.FileVersion
            extractor = (Get-Content -Raw build/tooling/qt-runtime-source.json | ConvertFrom-Json).extractor
          }
          $inventory | ConvertTo-Json | Set-Content build/ci-environment.json -Encoding utf8
          Write-Output ("::notice title=CI environment::" + ($inventory | ConvertTo-Json -Compress))
          try {
            ./scripts/package-windows.ps1 -CrtRoot $crt[0].FullName *> build/ci-build.log
          } catch {
            $message = ($_.Exception.Message + "`n" + ((Get-Content build/ci-build.log -Tail 20 -ErrorAction SilentlyContinue) -join "`n"))
            $message = $message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Build and package::$message"
            throw
          } finally {
            Get-Content build/ci-build.log -Tail 30 -ErrorAction SilentlyContinue
          }

      - name: Verify ZIP and import data in memory
        run: |
          @'
          import base64, hashlib, io, json, math, os, pathlib, struct, subprocess, zipfile
          root = pathlib.Path.cwd()
          archives = sorted((root / 'build/packages').glob('*/*.zip'))
          assert len(archives) == 1, 'Expected one ZIP'
          archive = archives[0]
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert (archive.parent / 'SHA256SUMS.txt').read_text().split()[0] == digest
          destination = root / 'build' / ('portable ' + chr(241))
          with zipfile.ZipFile(archive) as source:
              assert source.testzip() is None
              for member in source.infolist():
                  assert (destination / member.filename).resolve().is_relative_to(destination.resolve())
              source.extractall(destination)
          executables = list(destination.glob('*/STLCutStudioAI.exe'))
          assert len(executables) == 1
          exe = executables[0]
          manifest = json.loads((exe.parent / 'manifest.json').read_text(encoding='utf-8-sig'))
          for item in manifest['files']:
              content = (exe.parent / item['path']).read_bytes()
              assert len(content) == item['bytes']
              assert hashlib.sha256(content).hexdigest() == item['sha256'], item['path']
          actual = {p.relative_to(exe.parent).as_posix() for p in exe.parent.rglob('*') if p.is_file()}
          assert actual == {p['path'] for p in manifest['files']} | {'manifest.json'}
          env = {k.upper(): v for k, v in os.environ.items()
                 if not k.upper().startswith(('QT', 'QML', 'STL_QT_ROOT', 'CMAKE_PREFIX_PATH'))}
          env['PATH'] = str(pathlib.Path(env['SYSTEMROOT']) / 'System32') + os.pathsep + env['SYSTEMROOT']
          vertices = [(0,0,0),(10,0,0),(10,20,0),(0,20,0),(0,0,30),(10,0,30),(10,20,30),(0,20,30)]
          faces = [(0,2,1),(0,3,2),(4,5,6),(4,6,7),(0,1,5),(0,5,4),(1,2,6),(1,6,5),(2,3,7),(2,7,6),(3,0,4),(3,4,7)]
          records = b''.join(struct.pack('<12fH',0,0,0,*(n for i in face for n in vertices[i]),0) for face in faces)
          binary = b'solid cube'.ljust(80,b' ') + struct.pack('<I',12) + records
          ascii_stl = ('solid cube\n' + ''.join('facet normal 0 0 0\nouter loop\n' +
                       ''.join('vertex %s %s %s\n' % vertices[i] for i in face) +
                       'endloop\nendfacet\n' for face in faces) + 'endsolid cube\n').encode()
          cases = [('binary-solid-header', binary, True), ('ascii', ascii_stl, True),
                   ('binary-pk-header', b'PK arbitrary STL'.ljust(80,b' ') + binary[80:], True),
                   ('empty', b'', False), ('truncated', binary[:-1], False),
                   ('non-finite', ascii_stl.replace(b'vertex 0 0 0', b'vertex nan 0 0', 1), False)]
          def make_3mf(required=''):
              output = io.BytesIO()
              vertex_xml = ''.join('<vertex x="%s" y="%s" z="%s"/>' % v for v in vertices)
              triangle_xml = ''.join('<triangle v1="%s" v2="%s" v3="%s"/>' % f for f in faces)
              with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as z:
                  z.writestr('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>')
                  z.writestr('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>')
                  z.writestr('3D/3dmodel.model','<model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02" '+required+'><resources><object id="1" type="model"><mesh><vertices>'+vertex_xml+'</vertices><triangles>'+triangle_xml+'</triangles></mesh></object></resources><build><item objectid="1"/></build></model>')
              return output.getvalue()
          cases += [('3mf-cube',make_3mf(),True),
                    ('3mf-required-extension',make_3mf('xmlns:custom="urn:unsupported" requiredextensions="custom"'),False)]
          outcomes = []
          for name, data, valid in cases:
              result = subprocess.run([str(exe),'--inspect-stdin'], input=data, capture_output=True,
                                      env=env, cwd=root, timeout=20)
              output = json.loads(result.stdout)
              assert output['ok'] == valid and result.returncode == (0 if valid else 1), (name, output)
              if valid:
                  assert output['triangles'] == 12 and output['dimensions'] == [10,20,30]
                  assert output['min'] == [0,0,0] and output['max'] == [10,20,30]
              outcomes.append({'case': name, 'passed': True, 'exit_code': result.returncode})
          for source_name,data in [('stl',binary),('3mf',make_3mf())]:
              volumes = []
              for side in ('positive','negative'):
                  cut = subprocess.run([str(exe),'--cut-stdin','0','0','1','15',side],input=data,capture_output=True,env=env,timeout=20)
                  assert cut.returncode == 0, cut.stderr
                  reimport = subprocess.run([str(exe),'--inspect-stdin'],input=cut.stdout,capture_output=True,env=env,timeout=20)
                  result = json.loads(reimport.stdout)
                  assert reimport.returncode == 0 and result['ok']
                  assert math.isclose(result['signed_volume'],3000,rel_tol=1e-6),result
                  volumes.append(result['signed_volume'])
              assert math.isclose(sum(volumes),6000,rel_tol=1e-6)
              outcomes.append({'case':source_name+'-cut-export-reimport','passed':True,'volumes':volumes})
          def binary_mesh(points,triangles):
              return b'Manifold acceptance'.ljust(80,b' ') + struct.pack('<I',len(triangles)) + b''.join(
                  struct.pack('<12fH',0,0,0,*(n for i in t for n in points[i]),0) for t in triangles)
          def hollow_tube(n=4):
              ring = [(-1,-1),(1,-1),(1,1),(-1,1)] if n == 4 else [
                  (math.cos(2*math.pi*i/n),math.sin(2*math.pi*i/n)) for i in range(n)]
              points = [(s*x,s*y,z) for z in (0,2) for s in (2,1) for x,y in ring]
              triangles = []
              def quad(a,b,c,d): triangles.extend([(a,b,c),(a,c,d)])
              for i in range(n):
                  j = (i+1)%n
                  quad(i,j,2*n+j,2*n+i)
                  quad(n+j,n+i,3*n+i,3*n+j)
                  quad(2*n+i,2*n+j,3*n+j,3*n+i)
                  quad(j,i,n+i,n+j)
              return binary_mesh(points,triangles)
          cavity_points = vertices + [(2.5+x*.5,5+y*.5,7.5+z*.5) for x,y,z in vertices]
          cavity_faces = faces + [(a+8,c+8,b+8) for a,b,c in faces]
          polygon = [(0,0),(2,0),(2,1),(1,1),(1,2),(0,2)]
          l_points = [(x,y,z) for z in (0,1) for x,y in polygon]
          roof = [(0,1,3),(1,2,3),(0,3,5),(3,4,5)]
          l_faces = [(a,c,b) for a,b,c in roof] + [(a+6,b+6,c+6) for a,b,c in roof]
          for i in range(6):
              j=(i+1)%6
              l_faces += [(i,j,j+6),(i,j+6,i+6)]
          for name,data,normal,offset,expected,hole in [
              ('hollow-tube',hollow_tube(),(0,0,1),1,(12,12),True),
              ('enclosed-cavity',binary_mesh(cavity_points,cavity_faces),(0,0,1),15,(2625,2625),False),
              ('coplanar-edges',binary,(1,-.5,0),0,(3000,3000),False),
              ('coplanar-concave-face',binary_mesh(l_points,l_faces),(1,0,0),1,(1,2),False),
              ('contour-over-4096',hollow_tube(1100),(0,0,1),1,None,True)]:
              volumes=[]
              for index,side in enumerate(('positive','negative')):
                  cut=subprocess.run([str(exe),'--cut-stdin',*(str(n) for n in normal),str(offset),side],input=data,capture_output=True,env=env,timeout=30)
                  assert cut.returncode == 0,(name,cut.stderr)
                  reimport=subprocess.run([str(exe),'--inspect-stdin'],input=cut.stdout,capture_output=True,env=env,timeout=20)
                  result=json.loads(reimport.stdout)
                  assert reimport.returncode == 0 and result['ok'],(name,result)
                  if expected: assert math.isclose(result['signed_volume'],expected[index],rel_tol=1e-5),(name,result)
                  volumes.append(result['signed_volume'])
                  count=struct.unpack_from('<I',cut.stdout,80)[0]
                  edges={}
                  for i in range(count):
                      row=struct.unpack_from('<12fH',cut.stdout,84+50*i)
                      tri=[tuple(row[3+3*j:6+3*j]) for j in range(3)]
                      for a,b in zip(tri,tri[1:]+tri[:1]):
                          edge=edges.setdefault(tuple(sorted((a,b))),[0,0])
                          edge[0]+=1;edge[1]+=1 if a<b else -1
                      if hole and all(abs(v[2]-offset)<1e-6 for v in tri):
                          turns=[(tri[(j+1)%3][0]-tri[j][0])*(-tri[j][1])-(tri[(j+1)%3][1]-tri[j][1])*(-tri[j][0]) for j in range(3)]
                          assert not (min(turns)>=-1e-10 or max(turns)<=1e-10),(name,'filled hole')
                  assert all(e == [2,0] for e in edges.values()),(name,'STL not closed/oriented')
              original=subprocess.run([str(exe),'--inspect-stdin'],input=data,capture_output=True,env=env,timeout=20)
              assert math.isclose(sum(volumes),json.loads(original.stdout)['signed_volume'],rel_tol=1e-5),name
              outcomes.append({'case':name,'passed':True,'volumes':volumes})
          def edit(commands,limits=None,valid=True):
              request={'commands':commands}
              if limits is not None: request['limits']=limits
              process=subprocess.run([str(exe),'--edit-stdin',json.dumps(request,separators=(',',':'))],input=binary,capture_output=True,env=env,timeout=30)
              result=json.loads(process.stdout)
              assert result['ok'] == valid and process.returncode == (0 if valid else 1),result
              return result
          first={'op':'cut','piece':1,'normal':[0,0,1],'offset':15}
          second={'op':'cut','piece':2,'normal':[1,0,0],'offset':5,'visible':False}
          restored=edit([first,second,{'op':'undo'},{'op':'redo'}])
          assert [p['id'] for p in restored['states'][3]['pieces']] == [2,3]
          assert restored['states'][3]['selected'] == 2 and restored['states'][3]['redo'] == 1
          assert restored['states'][3]['plane_normal'] == [1,0,0] and not restored['states'][3]['plane_visible']
          for key in ('pieces','selected','plane_normal','plane_offset','plane_visible'):
              assert restored['states'][2][key] == restored['states'][4][key],key
          assert math.isclose(sum(p['signed_volume'] for p in restored['current']['pieces']),6000,rel_tol=1e-7)
          outcomes.append({'case':'history-chained-cuts-undo-redo','passed':True})
          branch=edit([first,second,{'op':'undo'},{'op':'cut','piece':3,'normal':[0,1,0],'offset':10},{'op':'redo'}])
          assert [p['id'] for p in branch['current']['pieces']] == [2,6,7] and branch['current']['redo'] == 0
          outcomes.append({'case':'history-new-branch-discards-redo','passed':True})
          exported=edit([first,second,*({'op':'export','piece':i} for i in (4,5,3,1))])
          for item,volume in zip(exported['exports'],(1500,1500,3000,6000)):
              p=subprocess.run([str(exe),'--inspect-stdin'],input=base64.b64decode(item['stl_base64']),capture_output=True,env=env,timeout=20)
              assert p.returncode == 0 and math.isclose(json.loads(p.stdout)['signed_volume'],volume,rel_tol=1e-6)
          outcomes.append({'case':'history-export-active-pieces-and-original','passed':True})
          limited=edit([first,second,{'op':'cut','piece':3,'normal':[0,1,0],'offset':10},{'op':'undo'},{'op':'undo'}],{'steps':1})
          assert [p['id'] for p in limited['current']['pieces']] == [4,5,3] and limited['current']['undo'] == 0 and limited['current']['redo'] == 1
          outcomes.append({'case':'history-step-budget-eviction','passed':True})
          initial=edit([])['current']['retained_bytes']
          rejected=edit([first],{'bytes':initial+80},False)
          assert [p['id'] for p in rejected['current']['pieces']] == [1] and rejected['current']['undo'] == 0
          outcomes.append({'case':'history-memory-budget-transaction','passed':True})
          limited=edit([first,second],{'pieces':2},False)
          assert [p['id'] for p in limited['current']['pieces']] == [2,3] and limited['current']['undo'] == 1
          outcomes.append({'case':'history-active-piece-limit','passed':True})
          translated=binary_mesh([(x+1000000,y,z) for x,y,z in vertices],faces)
          thin={'op':'cut','normal':[1,0,0],'offset':1000000.01}
          unsafe=subprocess.run([str(exe),'--edit-stdin',json.dumps({'commands':[thin,{'op':'export','piece':3}]})],input=translated,capture_output=True,env=env,timeout=30)
          rejected=json.loads(unsafe.stdout)
          assert unsafe.returncode == 1 and not rejected['ok'] and 'float32' in rejected['error'],rejected
          assert rejected['exports'] == [] and [p['id'] for p in rejected['current']['pieces']] == [2,3]
          assert rejected['current']['undo'] == 1
          outcomes.append({'case':'export-invalid-float32-retains-session','passed':True})
          unsafe=subprocess.run([str(exe),'--cut-stdin','1','0','0','1000000.01','negative'],input=translated,capture_output=True,env=env,timeout=30)
          assert unsafe.returncode == 1 and unsafe.stdout == b'' and b'float32' in unsafe.stderr,unsafe.stderr
          outcomes.append({'case':'cut-invalid-float32-no-output','passed':True})
          spec={'diameter':3,'depth':4,'clearance':.2,'wall':1}
          connected=edit([{**first,'connector':spec},{'op':'undo'},{'op':'redo'},{'op':'export','piece':2},{'op':'export','piece':3}])
          assert connected['states'][1]['pieces'] == connected['states'][3]['pieces']
          area=lambda radius:32*radius*radius*math.sin(2*math.pi/64)
          assert math.isclose(connected['current']['pieces'][0]['signed_volume'],3000+area(1.5)*4,rel_tol=1e-7)
          assert math.isclose(connected['current']['pieces'][1]['signed_volume'],3000-area(1.6)*4.1,rel_tol=1e-7)
          outcomes.append({'case':'connector-dimensions-export-undo-redo','passed':True})
          rejected=edit([{**first,'connector':{**spec,'diameter':9}}],valid=False)
          assert [p['id'] for p in rejected['current']['pieces']] == [1] and rejected['current']['undo'] == 0
          outcomes.append({'case':'connector-insufficient-wall-retains-session','passed':True})
          def colored_3mf(paint=False):
              with zipfile.ZipFile(io.BytesIO(make_3mf())) as source:
                  entries={name:source.read(name) for name in source.namelist()}
              xml=entries['3D/3dmodel.model'].decode()
              original=xml[xml.index('<object '):xml.index('</object>')+9]
              red=original.replace('type="model"','type="model" pid="100" pindex="0"')
              blue=original.replace('id="1"','id="2"',1).replace('type="model"','type="model" pid="100" pindex="1"')
              palette='<basematerials id="100"><base name="Red" displaycolor="#FF0000FF"/><base name="Blue" displaycolor="#0000FFFF"/></basematerials>'
              xml=xml.replace(original,palette+red+blue).replace('<item objectid="1"/>','<item objectid="1"/><item objectid="2" transform="1 0 0 0 1 0 0 0 1 10 0 0"/>')
              if paint: xml=xml.replace('<triangle ','<triangle paint_color="8" ')
              entries['3D/3dmodel.model']=xml.encode()
              output=io.BytesIO()
              with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as target:
                  for name,data in entries.items(): target.writestr(name,data)
              return output.getvalue()
          def material_edit(commands,valid=True,paint=False):
              process=subprocess.run([str(exe),'--edit-stdin',json.dumps({'commands':commands})],input=colored_3mf(paint),capture_output=True,env=env,timeout=30)
              result=json.loads(process.stdout)
              assert result['ok'] == valid and process.returncode == (0 if valid else 1),result
              return result
          split={'op':'split-materials'}
          separated=material_edit([split,{'op':'undo'},{'op':'redo'},{'op':'export','piece':2},{'op':'export','piece':3}])
          assert separated['states'][1]['pieces'] == separated['states'][3]['pieces']
          assert [p['materials'][0]['rgba'] for p in separated['current']['pieces']] == [[255,0,0,255],[0,0,255,255]]
          assert all(p['signed_volume'] == 6000 for p in separated['current']['pieces'])
          outcomes.append({'case':'material-split-colors-history-export','passed':True})
          linked=material_edit([{**split,'connector':spec},{'op':'export','piece':2},{'op':'export','piece':3}])
          assert all(p['format'] == '3mf-material-connected' for p in linked['current']['pieces'])
          assert math.isclose(linked['current']['pieces'][0]['signed_volume'],6000+area(1.5)*4,rel_tol=1e-7)
          assert math.isclose(linked['current']['pieces'][1]['signed_volume'],6000-area(1.6)*4.1,rel_tol=1e-7)
          outcomes.append({'case':'material-planar-automatic-connectors','passed':True})
          rejected=material_edit([split],False,True)
          assert rejected['current']['undo'] == 0 and len(rejected['current']['pieces']) == 1
          outcomes.append({'case':'uninterpreted-paint-no-false-split','passed':True})
          def painted_3mf(code='841'):
              with zipfile.ZipFile(io.BytesIO(colored_3mf())) as source:
                  entries={name:source.read(name) for name in source.namelist()}
              xml=entries['3D/3dmodel.model'].decode().replace('<triangle ','<triangle paint_color="'+code+'" ',1)
              entries['3D/3dmodel.model']=xml.encode()
              entries['Metadata/project_settings.config']=json.dumps({'filament_colour':['#FF0000','#0000FF']}).encode()
              entries['Metadata/model_settings.config']=b'<config><object id="1"><metadata key="extruder" value="1"/></object><object id="2"><metadata key="extruder" value="2"/></object></config>'
              output=io.BytesIO()
              with zipfile.ZipFile(output,'w',zipfile.ZIP_STORED) as target:
                  for name,data in entries.items():target.writestr(name,data)
              return output.getvalue()
          decoded=subprocess.run([str(exe),'--decode-paint','841'],capture_output=True,env=env,timeout=20)
          info=json.loads(decoded.stdout)
          assert decoded.returncode == 0 and info['leaf_count'] == 2
          assert info['filament_fractions'] == [{'filament':1,'fraction':.5},{'filament':2,'fraction':.5}]
          outcomes.append({'case':'paint-code-subdivision-area','passed':True})
          painted=subprocess.run([str(exe),'--inspect-view-stdin'],input=painted_3mf(),capture_output=True,env=env,timeout=20)
          info=json.loads(painted.stdout)
          assert painted.returncode == 0 and info['triangles'] == 24 and info['signed_volume'] == 12000
          assert info['painted_triangles'] == 1 and info['paint_facets'] == 2 and info['unresolved_paint_facets'] == 0
          assert info['view_vertices'] == 75 and {tuple(c['rgb']) for c in info['view_colors']} == {(255,0,0),(0,0,255)}
          outcomes.append({'case':'paint-import-cpu-view-source-preserved','passed':True})
          bad=subprocess.run([str(exe),'--inspect-stdin'],input=painted_3mf('C'),capture_output=True,env=env,timeout=20)
          info=json.loads(bad.stdout)
          assert bad.returncode == 1 and not info['ok'] and 'truncado' in info['error']
          outcomes.append({'case':'paint-truncated-code-rejected','passed':True})
          corrupt=bytearray(painted_3mf())
          with zipfile.ZipFile(io.BytesIO(corrupt)) as package:entry=package.getinfo('Metadata/project_settings.config')
          offset=entry.header_offset+30+len(entry.filename.encode())+len(entry.extra)
          corrupt[offset+1]^=1
          bad=subprocess.run([str(exe),'--inspect-stdin'],input=corrupt,capture_output=True,env=env,timeout=20)
          info=json.loads(bad.stdout)
          assert bad.returncode == 1 and not info['ok'] and 'CRC' in info['error']
          outcomes.append({'case':'paint-metadata-crc-rejected','passed':True})
          report = {'archive': archive.name, 'sha256': digest, 'manifest_files': len(manifest['files']),
