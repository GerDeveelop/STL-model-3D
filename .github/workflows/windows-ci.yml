           assert j['ok']==valid and p.returncode==(0 if valid else 1),j
           return j

          import base64,collections,random,re
          def mutate_zip(data,change=None,extras=None,compression=zipfile.ZIP_DEFLATED):
           b=io.BytesIO()
           with zipfile.ZipFile(io.BytesIO(data)) as source,zipfile.ZipFile(b,'w',compression) as target:
            for name in source.namelist():
             if name in (extras or {}):continue
             content=source.read(name)
             if name=='3D/3dmodel.model' and change:content=change(content.decode()).encode()
             target.writestr(name,content)
            for name,content in (extras or {}).items():target.writestr(name,content)
           return b.getvalue()
          def paint_model(code='841',reflect=False,palette=True,default=True,external=False,nested=False,metadata=None,paint_all=False,double_faces=False):
           data=color_model(combined=True,reflect=reflect)
           def change(s):
            if double_faces:
             body=s[s.index('<triangles>')+11:s.index('</triangles>')]
             s=s.replace(body,body*(2 if double_faces is True else int(double_faces)))
            return s.replace('<triangle ','<triangle paint_color="'+code+'" ', -1 if paint_all else 1)
           data=mutate_zip(data,change)
           extras={}
           if palette:extras['Metadata/project_settings.config']=json.dumps({'filament_colour':['#FF0000','#0000FF']})
           if default:extras['Metadata/model_settings.config']=metadata or '<config><object id="'+('30' if external else '10')+'"><metadata key="extruder" value="1"/></object></config>'
           if external:
            with zipfile.ZipFile(io.BytesIO(data)) as z:body=z.read('3D/3dmodel.model').decode()
            if nested:
             body=body.replace('</resources>','<object id="20" type="model"><components><component objectid="10"/></components></object></resources>')
            target_id='20' if nested else '10'
            root_xml='<model unit="millimeter" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02" xmlns:p="http://schemas.microsoft.com/3dmanufacturing/production/2015/06" requiredextensions="p"><resources><object id="30" type="model"><components><component objectid="'+target_id+'" p:path="/3D/Objects/body.model"/></components></object></resources><build><item objectid="30"/></build></model>'
            def uuids(xml,seed):
             if 'xmlns:p=' not in xml:xml=xml.replace('<model ','<model xmlns:p="http://schemas.microsoft.com/3dmanufacturing/production/2015/06" ',1)
             xml=re.sub(r'<object id="(\d+)"',lambda m:'<object id="'+m[1]+'" p:UUID="'+format(seed+int(m[1]),'08x')+'-0000-4000-8000-000000000000"',xml)
             xml=xml.replace('<build>','<build p:UUID="'+format(seed+100,'08x')+'-0000-4000-8000-000000000000">')
             xml=xml.replace('<item ','<item p:UUID="'+format(seed+101,'08x')+'-0000-4000-8000-000000000000" ')
             xml=xml.replace('<component ','<component p:UUID="'+format(seed+102,'08x')+'-0000-4000-8000-000000000000" ')
             return xml
            body=uuids(body,1000);root_xml=uuids(root_xml,2000)
            data=mutate_zip(data,lambda _:root_xml,{'3D/Objects/body.model':body,'3D/_rels/3dmodel.model.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/Objects/body.model" Id="body" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>'})
           return mutate_zip(data,extras=extras)
