           def obj(oid,offset,color,append=False):
            vv=[(20*x+offset,20*y,20*z) for x,y,z in verts]
            ff=list(faces)
            if append:vv += [(20*x+offset+40,20*y,20*z) for x,y,z in verts];ff += [tuple(i+8 for i in f) for f in faces]
            vs=''.join(f'<vertex x="{x}" y="{y}" z="{z}"/>' for x,y,z in vv)
            ts=''.join(f'<triangle v1="{a}" v2="{b}" v3="{c}" '+('paint_color="8" ' if paint else '')+('pid="1" p1="0" p2="1" p3="0" ' if partial and i==0 else '')+'/>' for i,(a,b,c) in enumerate(ff))
            return f'<object id="{oid}" type="model" name="Body {oid}" pid="1" pindex="{color}"><mesh><vertices>{vs}</vertices><triangles>{ts}</triangles></mesh></object>'
           objs=obj(10,0,0,combined)
           if not combined:objs+=obj(11,20,1)
           items=('<item objectid="10" transform="-1 0 0 0 1 0 0 0 1 20 0 0"/>' if reflect else '<item objectid="10"/>')+('' if combined else '<item objectid="11"/>')
           xml=f'<model unit="millimeter" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02" xmlns:m="http://schemas.microsoft.com/3dmanufacturing/material/2015/02" '+('requiredextensions="m"' if mode!='base' else '')+f'><resources>{materials}{objs}</resources><build>{items}</build></model>'
           b=io.BytesIO()
           with zipfile.ZipFile(b,'w',zipfile.ZIP_DEFLATED) as z:
            z.writestr('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>')
            z.writestr('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>')
            z.writestr('3D/3dmodel.model',xml)
